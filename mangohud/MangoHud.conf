# Inferna MangoHud configuration (managed by inferna-dotfiles)
# Press Shift_R+F12 in-game to toggle the HUD overlay.

position=top-left
round_corners=8
background_alpha=0.72
font_size=19
alpha=0.95

# Inferna palette (obsidian, ivory, ember orange, molten gold, forged crimson)
background_color=140d0b
text_color=f2e5d5
gpu_color=ff622e
cpu_color=f2a949
vram_color=e87a38
ram_color=d94a24
engine_color=c99668
io_color=e88b3a
frametime_color=ff622e
media_player_color=f2a949
wine_color=c8231a
battery_color=f2a949

# FPS color thresholds: <30 crimson, <60 molten gold, >=60 warm ivory
fps_color_change
fps_value=30,60
fps_color=c8231a,f2a949,f5eadc

# Telemetry layout
fps
frametime=0
frame_timing=1
gpu_stats
gpu_temp
gpu_core_clock
vram
cpu_stats
cpu_temp
ram
gamemode
toggle_hud=Shift_R+F12
